name: Build images

# Builds from `dronecode`, not `main`. This fork's customisations live on
# `dronecode` and that is what gets deployed; `main` tracks upstream. Deploying
# from a non-default branch also means a stray push, or a fork sync through the
# GitHub UI, cannot ship anything on its own.
on:
  push:
    branches:
      - dronecode

# Required for the OIDC token used to assume the ECR push role.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 810743298831.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build-dbmigrator-image:
    if: github.ref == 'refs/heads/dronecode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push gitjobs-dbmigrator image
        env:
          # Tagged by commit SHA only, as upstream does. Immutable tags mean a
          # task definition pins an exact build, and rollback is repointing at
          # an older SHA rather than rebuilding.
          ECR_REPOSITORY: ${{ env.ECR_REGISTRY }}/gitjobs/dbmigrator
        run: |
          docker build \
            -f database/migrations/Dockerfile \
            -t $ECR_REPOSITORY:$GITHUB_SHA \
            .
          docker push $ECR_REPOSITORY:$GITHUB_SHA

  build-server-image:
    if: github.ref == 'refs/heads/dronecode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push gitjobs-server image
        env:
          ECR_REPOSITORY: ${{ env.ECR_REGISTRY }}/gitjobs/server
        run: |
          docker build \
            -f gitjobs-server/Dockerfile \
            -t $ECR_REPOSITORY:$GITHUB_SHA \
            .
          docker push $ECR_REPOSITORY:$GITHUB_SHA

  build-syncer-image:
    if: github.ref == 'refs/heads/dronecode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push gitjobs-syncer image
        env:
          ECR_REPOSITORY: ${{ env.ECR_REGISTRY }}/gitjobs/syncer
        run: |
          docker build \
            -f gitjobs-syncer/Dockerfile \
            -t $ECR_REPOSITORY:$GITHUB_SHA \
            .
          docker push $ECR_REPOSITORY:$GITHUB_SHA
